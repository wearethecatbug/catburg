name: Safe Cat CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safe-cat:
    name: Build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Prepare diagnostics
        shell: bash
        run: |
          set -euo pipefail
          diagnostics_directory="$RUNNER_TEMP/safe-cat-diagnostics"
          playwright_browsers_directory="$RUNNER_TEMP/safe-cat-playwright-browsers"
          mkdir -p "$diagnostics_directory"
          printf 'SAFE_CAT_DIAGNOSTICS=%s\n' "$diagnostics_directory" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$playwright_browsers_directory" >> "$GITHUB_ENV"
          printf 'Safe Cat CI diagnostics for %s\n' "$GITHUB_SHA" > "$diagnostics_directory/metadata.txt"

      - name: Select pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global corepack@0.35.0
          corepack enable
          corepack pnpm --version | tee "$SAFE_CAT_DIAGNOSTICS/pnpm-version.log"

      - name: Install Safe Cat dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm --filter safe_app... install --frozen-lockfile --ignore-scripts --ignore-pnpmfile 2>&1 | tee "$SAFE_CAT_DIAGNOSTICS/install.log"

      - name: Run unit, boundary, and static checks
        working-directory: apps/safe_app
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-unit.mjs positive 2>&1 | tee "$SAFE_CAT_DIAGNOSTICS/unit.log"
          node scripts/check-boundaries.mjs 2>&1 | tee "$SAFE_CAT_DIAGNOSTICS/boundaries.log"
          node scripts/check-boundaries.mjs --self-test 2>&1 | tee "$SAFE_CAT_DIAGNOSTICS/boundaries-self-test.log"
          node node_modules/next/dist/bin/next lint --no-cache 2>&1 | tee "$SAFE_CAT_DIAGNOSTICS/lint.log"
          node node_modules/next/dist/bin/next build 2>&1 | tee "$SAFE_CAT_DIAGNOSTICS/build.log"
          node node_modules/typescript/bin/tsc --noEmit --incremental false 2>&1 | tee "$SAFE_CAT_DIAGNOSTICS/types.log"

      - name: Install isolated browser runner
        shell: bash
        run: |
          set -euo pipefail
          playwright_directory="$RUNNER_TEMP/safe-cat-playwright"
          npm install --prefix "$playwright_directory" playwright@1.62.1 2>&1 | tee "$SAFE_CAT_DIAGNOSTICS/playwright-install.log"
          node "$playwright_directory/node_modules/playwright/cli.js" install --with-deps chrome 2>&1 | tee "$SAFE_CAT_DIAGNOSTICS/chrome-install.log"

      - name: Run production browser regression
        working-directory: apps/safe_app
        shell: bash
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/safe-cat-playwright/node_modules/playwright
          SAFE_CAT_BASE_URL: http://127.0.0.1:3213
          REGRESSION_ARTIFACT_DIR: ${{ runner.temp }}/safe-cat-diagnostics/regression
          REGRESSION_RUN_LABEL: ci
        run: |
          set -euo pipefail
          server_log="$SAFE_CAT_DIAGNOSTICS/server.log"
          mkdir -p "$REGRESSION_ARTIFACT_DIR"
          server_pid=""
          cleanup() {
            if [[ -n "$server_pid" ]] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3213 > "$server_log" 2>&1 &
          server_pid="$!"
          for attempt in {1..60}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:3213/ > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_log"
              exit 1
            fi
            if [[ "$attempt" == "60" ]]; then
              cat "$server_log"
              exit 1
            fi
            sleep 1
          done
          node tests/safe-game-interactions.cjs 2>&1 | tee "$SAFE_CAT_DIAGNOSTICS/browser-interactions.log"
          node tests/runtime-regression.cjs 2>&1 | tee "$SAFE_CAT_DIAGNOSTICS/runtime-regression.log"

      - name: Upload Safe Cat diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: safe-cat-ci-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/safe-cat-diagnostics
          if-no-files-found: error
          retention-days: 14
